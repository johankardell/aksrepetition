apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: orders
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: orders-telemetry
                  key: connection-string
            - name: OTEL_SERVICE_NAME
              value: order-api
            - name: OTEL_TRACES_SAMPLER
              value: microsoft.fixed_percentage
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: orders
spec:
  template:
    spec:
      containers:
        - name: worker
          env:
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: orders-telemetry
                  key: connection-string
            - name: OTEL_SERVICE_NAME
              value: order-worker
            - name: OTEL_TRACES_SAMPLER
              value: microsoft.fixed_percentage
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"

apiVersion: v1
kind: ResourceQuota
metadata:
  name: workshop-budget
spec:
  hard:
    pods: "6"
    requests.cpu: "1"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 768Mi
    requests.ephemeral-storage: 128Mi
    limits.ephemeral-storage: 256Mi
    services: "1"
    services.loadbalancers: "0"
    persistentvolumeclaims: "0"

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workload-reliability
resources:
  - namespace.yaml
  - budget.yaml
  - deployment.yaml
  - service.yaml
  - network-policy.yaml
configMapGenerator:
  - name: diagnostic-code
    files:
      - diagnostic.py
      - memory.py
      - traffic.py
generatorOptions:
  disableNameSuffixHash: true

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: lab-config
  namespace: orders
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: __API_CLIENT_ID__
    keyvaultName: __KEY_VAULT__
    tenantId: __TENANT_ID__
    objects: |
      array:
        - |
          objectName: lab-version
          objectType: secret
          objectVersion: ""


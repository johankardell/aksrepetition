apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: orders
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  path: ./gitops/clusters/primary/apps/orders
  prune: true
  wait: true
  serviceAccountName: orders-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: orders-test
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  path: ./gitops/clusters/primary/apps/orders-test
  prune: true
  wait: true
  serviceAccountName: orders-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system

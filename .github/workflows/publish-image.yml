name: Publish private order image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "scripts/connect-acr-podman.sh", "scripts/lib.sh", ".github/workflows/publish-image.yml"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-order-image
  cancel-in-progress: false
jobs:
  publish:
    # This is a real, operator-provisioned, VNet-connected Linux runner, not a hosted label.
    runs-on: [self-hosted, Linux, X64, aks-private]
    environment: acr-publish
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, reviewed 2026-09-10
        with:
          persist-credentials: false
      - uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3, reviewed 2026-09-10
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build once and publish immutable evidence
        shell: bash
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          REGISTRY: ${{ vars.REGISTRY_SERVER }}
        run: |
          set -euo pipefail
          bash ./scripts/connect-acr-podman.sh --registry-name "$ACR_NAME" --registry-server "$REGISTRY"
          image="$REGISTRY/order-app:$GITHUB_SHA"
          podman build --pull=always --platform linux/amd64 --sbom=syft-spdx \
            --sbom-output image-sbom.spdx.json --metadata-file image-metadata.json \
            --file app/Containerfile --tag "$image" app
          jq -e '.spdxVersion | startswith("SPDX-")' image-sbom.spdx.json >/dev/null
          jq -e 'type == "object"' image-metadata.json >/dev/null
          podman push --digestfile image-digest.txt "$image"
          digest=$(tr -d '\r\n' < image-digest.txt)
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Missing immutable digest' >&2; exit 1; }
          printf '%s\n' "$REGISTRY/order-app@$digest" > image-reference.txt
          printf 'Published `%s`\n' "$REGISTRY/order-app@$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, reviewed 2026-09-10
        with:
          name: order-image-${{ github.sha }}
          path: |
            image-reference.txt
            image-digest.txt
            image-metadata.json
            image-sbom.spdx.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove cached registry and Azure credentials
        if: always()
        shell: bash
        env:
          REGISTRY: ${{ vars.REGISTRY_SERVER }}
        run: |
          set -euo pipefail
          status=0
          podman logout "$REGISTRY" || status=$?
          az logout || status=$?
          exit "$status"

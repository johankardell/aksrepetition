apiVersion: v1
kind: Pod
metadata:
  name: inference-probe
  namespace: kaito-lab
  labels:
    app: inference-probe
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 1800
  nodeSelector:
    agentpool: apps
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: __IMAGE_REFERENCE__
      command: ["python", "-c", "import time; time.sleep(1800)"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
